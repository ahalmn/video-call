<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Peer Call</title>

  <script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #1f2937;
    }

    body {
      min-height: 100vh;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
      border: none;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .app {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 560px;
    }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 15px;
      margin-bottom: 14px;
      background: #ffffff;
      border-radius: 12px;
      border: 1px solid #e5e7eb;
      font-size: 14px;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #9ca3af;
      flex-shrink: 0;
    }

    .status-dot.online {
      background: #22c55e;
    }

    .status-dot.warning {
      background: #f59e0b;
    }

    .status-dot.error {
      background: #ef4444;
    }

    .card {
      background: #ffffff;
      border-radius: 18px;
      padding: 22px;
      border: 1px solid #e5e7eb;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.05);
    }

    .section {
      margin-bottom: 24px;
    }

    .section:last-child {
      margin-bottom: 0;
    }

    .section-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 9px;
    }

    .input-row {
      display: flex;
      gap: 8px;
    }

    .incoming-peer-row {
      width: 100%;
    }

    .incoming-peer-row input {
      flex: 1;
    }

    .incoming-peer-row .copy-btn {
      flex-shrink: 0;
    }

    input {
      width: 100%;
      min-width: 0;
      height: 46px;
      padding: 0 13px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      outline: none;
      background: #fff;
      color: #111827;
    }

    input:focus {
      border-color: #6b7280;
    }

    input[readonly] {
      background: #f9fafb;
    }

    .copy-btn {
      flex-shrink: 0;
      padding: 0 16px;
      border-radius: 10px;
      background: #111827;
      color: white;
      font-weight: 600;
    }

    .help {
      margin-top: 7px;
      color: #6b7280;
      font-size: 13px;
      line-height: 1.4;
    }

    .call-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    .call-btn {
      min-height: 48px;
      border-radius: 10px;
      color: white;
      font-weight: 700;
    }

    .audio-btn {
      background: #16a34a;
    }

    .video-btn {
      background: #2563eb;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.4;
    }

    .message.show {
      display: block;
    }

    .message.info {
      background: #eff6ff;
      color: #1d4ed8;
    }

    .message.success {
      background: #f0fdf4;
      color: #15803d;
    }

    .message.error {
      background: #fef2f2;
      color: #b91c1c;
    }

    /* =========================================================
       OVERLAY
    ========================================================= */

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0, 0, 0, 0.65);
    }

    .overlay.show {
      display: flex;
    }

    .dialog {
      width: 100%;
      max-width: 390px;
      background: white;
      border-radius: 22px;
      padding: 28px 22px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
    }

    .call-icon {
      width: 70px;
      height: 70px;
      margin: 0 auto 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #eff6ff;
      font-size: 32px;
    }

    .dialog h2 {
      margin: 0 0 8px;
      font-size: 23px;
    }

    .dialog p {
      margin: 6px 0;
      color: #6b7280;
      font-size: 14px;
      word-break: break-word;
    }

    .dialog strong {
      color: #111827;
    }

    .incoming-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 22px;
    }

    .reject-btn,
    .accept-btn {
      min-height: 48px;
      border-radius: 11px;
      color: white;
      font-weight: 700;
    }

    .reject-btn {
      background: #dc2626;
    }

    .accept-btn {
      background: #16a34a;
    }

    /* =========================================================
       OUTGOING CALL
    ========================================================= */

    .calling-dialog {
      padding-top: 30px;
      padding-bottom: 24px;
    }

    .calling-icon {
      position: relative;
      width: 78px;
      height: 78px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: #eff6ff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
    }

    .calling-icon::before,
    .calling-icon::after {
      content: "";
      position: absolute;
      inset: 0;
      border: 2px solid #93c5fd;
      border-radius: 50%;
      animation: pulse 1.8s infinite;
    }

    .calling-icon::after {
      animation-delay: 0.9s;
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
        opacity: 0.8;
      }

      100% {
        transform: scale(1.55);
        opacity: 0;
      }
    }

    .calling-text {
      font-size: 16px;
      font-weight: 600;
      margin-top: 15px;
    }

    .calling-dots::after {
      content: "";
      animation: dots 1.4s infinite;
    }

    @keyframes dots {
      0% {
        content: "";
      }

      25% {
        content: ".";
      }

      50% {
        content: "..";
      }

      75%,
      100% {
        content: "...";
      }
    }

    .cancel-call-btn {
      width: 100%;
      min-height: 48px;
      margin-top: 24px;
      border-radius: 11px;
      background: #dc2626;
      color: white;
      font-weight: 700;
    }

    /* =========================================================
       ACTIVE CALL
    ========================================================= */

    .call-screen {
      position: fixed;
      inset: 0;
      z-index: 1100;
      display: none;
      background: #000;
      color: white;
    }

    .call-screen.show {
      display: flex;
      flex-direction: column;
    }

    .call-header {
      position: absolute;
      z-index: 5;
      top: 0;
      left: 0;
      right: 0;
      padding:
        calc(15px + env(safe-area-inset-top))
        16px
        15px;

      background: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.75),
        rgba(0, 0, 0, 0)
      );
    }

    .call-header-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start;
    }

    .remote-name {
      font-weight: 700;
      font-size: 15px;
      word-break: break-all;
    }

    .call-meta {
      margin-top: 4px;
      font-size: 13px;
      opacity: 0.75;
    }

    .timer {
      font-size: 14px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .video-area {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #111;
    }

    #remoteVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #111;
    }

    #localVideo {
      position: absolute;
      top: calc(72px + env(safe-area-inset-top));
      right: 15px;
      width: 110px;
      height: 155px;
      object-fit: cover;
      border-radius: 12px;
      background: #222;
      border: 2px solid rgba(255, 255, 255, 0.7);
      z-index: 3;
    }

    .audio-avatar {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: #111;
      z-index: 1;
    }

    .audio-avatar-circle {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #374151;
      font-size: 42px;
    }

    .call-controls {
      position: absolute;
      z-index: 10;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      justify-content: center;
      gap: 12px;
      padding:
        18px
        15px
        calc(20px + env(safe-area-inset-bottom));

      background: linear-gradient(
        to top,
        rgba(0, 0, 0, 0.8),
        rgba(0, 0, 0, 0)
      );
    }

    .control-btn {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      color: white;
      background: #374151;
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .control-btn.active {
      background: #dc2626;
    }

    .end-btn {
      background: #dc2626;
    }

    .control-label {
      position: absolute;
      bottom: calc(82px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      padding: 6px 11px;
      border-radius: 20px;
      background: rgba(0, 0, 0, 0.65);
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    /* =========================================================
       WAITING
    ========================================================= */

    .waiting-banner {
      position: absolute;
      z-index: 20;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: none;
      text-align: center;
      width: 90%;
      max-width: 350px;
    }

    .waiting-banner.show {
      display: block;
    }

    .waiting-circle {
      width: 82px;
      height: 82px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: #1f2937;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 35px;
    }

    .waiting-title {
      font-size: 22px;
      font-weight: 700;
    }

    .waiting-subtitle {
      margin-top: 8px;
      color: #d1d5db;
      font-size: 14px;
      word-break: break-word;
    }

    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 500px) {

      .app {
        padding: 12px;
      }

      .card {
        padding: 18px;
        border-radius: 15px;
      }

      .call-buttons {
        grid-template-columns: 1fr;
      }

      .input-row {
        flex-direction: column;
      }

      /* Keep incoming Peer ID and Copy button together */
      .incoming-peer-row {
        flex-direction: row;
      }

      .incoming-peer-row input {
        flex: 1;
        min-width: 0;
      }

      .incoming-peer-row .copy-btn {
        flex-shrink: 0;
        height: 46px;
      }

      .copy-btn {
        height: 44px;
      }

      #localVideo {
        width: 92px;
        height: 130px;
        top: calc(70px + env(safe-area-inset-top));
        right: 10px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================================================
       HOME
  ========================================================= -->

  <div class="app">

    <main class="container">

      <div class="status-bar">

        <span
          id="statusDot"
          class="status-dot"
        ></span>

        <span id="statusText">
          Connecting...
        </span>

      </div>


      <div class="card">

        <!-- Your Peer ID -->

        <div class="section">

          <div class="section-title">
            Your Peer ID
          </div>

          <div class="input-row">

            <input
              id="myPeerId"
              type="text"
              readonly
            >

            <button
              id="copyBtn"
              class="copy-btn"
              disabled
            >
              Copy
            </button>

          </div>

          <div class="help">
            Share this Peer ID with the person who wants to call you.
          </div>

        </div>


        <!-- Make Call -->

        <div class="section">

          <div class="section-title">
            Enter Peer ID to Call
          </div>

          <input
            id="remotePeerId"
            type="text"
            autocomplete="off"
          >

          <div class="help">
            Enter the other person's Peer ID.
          </div>


          <div class="call-buttons">

            <button
              id="audioCallBtn"
              class="call-btn audio-btn"
              disabled
            >
              🎤 Audio Call
            </button>

            <button
              id="videoCallBtn"
              class="call-btn video-btn"
              disabled
            >
              📹 Video Call
            </button>

          </div>


          <div
            id="message"
            class="message"
          ></div>

        </div>

      </div>

    </main>

  </div>


  <!-- =========================================================
       INCOMING CALL
  ========================================================= -->

  <div
    id="incomingOverlay"
    class="overlay"
  >

    <div class="dialog">

      <div class="call-icon">
        📞
      </div>

      <h2>
        Incoming Call
      </h2>


      <p>
        From:
        <strong id="incomingPeerId"></strong>
      </p>


      <div class="input-row incoming-peer-row">

        <input
          id="incomingPeerIdInput"
          type="text"
          readonly
        >

        <button
          id="copyIncomingPeerBtn"
          class="copy-btn"
        >
          Copy
        </button>

      </div>


      <p id="incomingCallType">
        Audio Call
      </p>


      <div class="incoming-buttons">

        <button
          id="rejectBtn"
          class="reject-btn"
        >
          Reject
        </button>

        <button
          id="acceptBtn"
          class="accept-btn"
        >
          Accept
        </button>

      </div>

    </div>

  </div>


  <!-- =========================================================
       OUTGOING CALL
  ========================================================= -->

  <div
    id="outgoingOverlay"
    class="overlay"
  >

    <div class="dialog calling-dialog">

      <div class="calling-icon">
        📞
      </div>

      <h2>
        Calling<span class="calling-dots"></span>
      </h2>


      <p>
        Calling:
        <strong id="outgoingPeerId"></strong>
      </p>


      <p id="outgoingCallType">
        Audio Call
      </p>


      <div class="calling-text">
        Waiting for the other person to answer
      </div>


      <button
        id="cancelCallBtn"
        class="cancel-call-btn"
      >
        Cancel Call
      </button>

    </div>

  </div>


  <!-- =========================================================
       ACTIVE CALL
  ========================================================= -->

  <div
    id="callScreen"
    class="call-screen"
  >

    <div class="call-header">

      <div class="call-header-top">

        <div>

          <div
            id="callPeerId"
            class="remote-name"
          ></div>

          <div
            id="callTypeText"
            class="call-meta"
          ></div>

        </div>


        <div
          id="callTimer"
          class="timer"
        >
          00:00
        </div>

      </div>

    </div>


    <div class="video-area">

      <video
        id="remoteVideo"
        autoplay
        playsinline
      ></video>


      <video
        id="localVideo"
        autoplay
        muted
        playsinline
      ></video>


      <div
        id="audioAvatar"
        class="audio-avatar"
      >

        <div class="audio-avatar-circle">
          🎤
        </div>

      </div>


      <div
        id="waitingBanner"
        class="waiting-banner"
      >

        <div class="waiting-circle">
          📞
        </div>

        <div class="waiting-title">
          Calling...
        </div>

        <div
          id="waitingPeerText"
          class="waiting-subtitle"
        ></div>

      </div>

    </div>


    <div
      id="controlLabel"
      class="control-label"
    ></div>


    <div class="call-controls">

      <button
        id="muteBtn"
        class="control-btn"
        title="Mute"
      >
        🎤
      </button>


      <button
        id="cameraBtn"
        class="control-btn"
        title="Camera"
      >
        📹
      </button>


      <button
        id="endCallBtn"
        class="control-btn end-btn"
        title="End Call"
      >
        ☎
      </button>

    </div>

  </div>


  <!-- =========================================================
       JAVASCRIPT
  ========================================================= -->

  <script>

    /* =========================================================
       DOM
    ========================================================= */

    const myPeerIdInput =
      document.getElementById("myPeerId");

    const remotePeerIdInput =
      document.getElementById("remotePeerId");


    const copyBtn =
      document.getElementById("copyBtn");

    const audioCallBtn =
      document.getElementById("audioCallBtn");

    const videoCallBtn =
      document.getElementById("videoCallBtn");


    const statusDot =
      document.getElementById("statusDot");

    const statusText =
      document.getElementById("statusText");

    const messageBox =
      document.getElementById("message");


    const incomingOverlay =
      document.getElementById("incomingOverlay");

    const incomingPeerId =
      document.getElementById("incomingPeerId");

    const incomingPeerIdInput =
      document.getElementById("incomingPeerIdInput");

    const incomingCallType =
      document.getElementById("incomingCallType");

    const copyIncomingPeerBtn =
      document.getElementById("copyIncomingPeerBtn");

    const acceptBtn =
      document.getElementById("acceptBtn");

    const rejectBtn =
      document.getElementById("rejectBtn");


    const outgoingOverlay =
      document.getElementById("outgoingOverlay");

    const outgoingPeerId =
      document.getElementById("outgoingPeerId");

    const outgoingCallType =
      document.getElementById("outgoingCallType");

    const cancelCallBtn =
      document.getElementById("cancelCallBtn");


    const callScreen =
      document.getElementById("callScreen");

    const callPeerId =
      document.getElementById("callPeerId");

    const callTypeText =
      document.getElementById("callTypeText");

    const callTimer =
      document.getElementById("callTimer");


    const remoteVideo =
      document.getElementById("remoteVideo");

    const localVideo =
      document.getElementById("localVideo");

    const audioAvatar =
      document.getElementById("audioAvatar");

    const waitingBanner =
      document.getElementById("waitingBanner");

    const waitingPeerText =
      document.getElementById("waitingPeerText");


    const muteBtn =
      document.getElementById("muteBtn");

    const cameraBtn =
      document.getElementById("cameraBtn");

    const endCallBtn =
      document.getElementById("endCallBtn");


    /* =========================================================
       STATE
    ========================================================= */

    let peer = null;

    let localStream = null;

    let currentCall = null;

    let incomingCall = null;


    let currentCallType = null;

    let currentRemotePeerId = null;


    let callStatusConnection = null;


    let callTimerInterval = null;

    let callStartTime = null;


    let isMuted = false;

    let isCameraOff = false;


    let outgoingCallPending = false;


    /* =========================================================
       PEER INITIALIZATION
    ========================================================= */

    function initializePeer() {

      peer = new Peer({
        debug: 1
      });


      peer.on(
        "open",
        handlePeerOpen
      );


      peer.on(
        "call",
        handleIncomingCall
      );


      peer.on(
        "connection",
        handleIncomingDataConnection
      );


      peer.on(
        "disconnected",
        handleDisconnected
      );


      peer.on(
        "error",
        handlePeerError
      );


      peer.on(
        "close",
        () => {

          setStatus(
            "Disconnected",
            "error"
          );

          disableCallButtons();

        }
      );

    }


    function handlePeerOpen(id) {

      myPeerIdInput.value = id;

      copyBtn.disabled = false;

      enableCallButtons();

      setStatus(
        "Online",
        "online"
      );

      showMessage(
        "You are ready to make and receive calls.",
        "success"
      );

    }


    /* =========================================================
       STATUS
    ========================================================= */

    function setStatus(
      text,
      type = ""
    ) {

      statusText.textContent = text;

      statusDot.className =
        "status-dot";


      if (type) {

        statusDot.classList.add(
          type
        );

      }

    }


    function showMessage(
      text,
      type = "info"
    ) {

      messageBox.textContent =
        text;

      messageBox.className =
        "message show " + type;

    }


    function hideMessage() {

      messageBox.textContent =
        "";

      messageBox.className =
        "message";

    }


    /* =========================================================
       BUTTON STATE
    ========================================================= */

    function enableCallButtons() {

      audioCallBtn.disabled = false;

      videoCallBtn.disabled = false;

    }


    function disableCallButtons() {

      audioCallBtn.disabled = true;

      videoCallBtn.disabled = true;

    }


    /* =========================================================
       COPY YOUR PEER ID
    ========================================================= */

    copyBtn.addEventListener(
      "click",
      async () => {

        const id =
          myPeerIdInput.value;


        if (!id) {
          return;
        }


        try {

          await navigator.clipboard
            .writeText(id);


          const originalText =
            copyBtn.textContent;


          copyBtn.textContent =
            "✓ Copied";


          setTimeout(() => {

            copyBtn.textContent =
              originalText;

          }, 1500);


        } catch (error) {

          myPeerIdInput.select();

          document.execCommand("copy");


          copyBtn.textContent =
            "✓ Copied";


          setTimeout(() => {

            copyBtn.textContent =
              "Copy";

          }, 1500);

        }

      }
    );


    /* =========================================================
       COPY INCOMING CALLER PEER ID
    ========================================================= */

    copyIncomingPeerBtn.addEventListener(
      "click",
      async () => {

        const id =
          incomingPeerIdInput.value;


        if (!id) {
          return;
        }


        try {

          await navigator.clipboard
            .writeText(id);


          copyIncomingPeerBtn.textContent =
            "✓ Copied";


          setTimeout(() => {

            copyIncomingPeerBtn.textContent =
              "Copy";

          }, 1500);


        } catch (error) {

          incomingPeerIdInput.select();

          document.execCommand("copy");


          copyIncomingPeerBtn.textContent =
            "✓ Copied";


          setTimeout(() => {

            copyIncomingPeerBtn.textContent =
              "Copy";

          }, 1500);

        }

      }
    );


    /* =========================================================
       OUTGOING CALL
    ========================================================= */

    audioCallBtn.addEventListener(
      "click",
      () => {

        startOutgoingCall("audio");

      }
    );


    videoCallBtn.addEventListener(
      "click",
      () => {

        startOutgoingCall("video");

      }
    );


    async function startOutgoingCall(type) {

      if (!peer || !peer.open) {

        showMessage(
          "Peer connection is not ready.",
          "error"
        );

        return;
      }


      if (
        outgoingCallPending ||
        currentCall
      ) {

        return;

      }


      const destination =
        remotePeerIdInput.value.trim();


      if (!destination) {

        showMessage(
          "Enter the other person's Peer ID.",
          "error"
        );

        remotePeerIdInput.focus();

        return;
      }


      if (destination === peer.id) {

        showMessage(
          "You cannot call your own Peer ID.",
          "error"
        );

        return;
      }


      hideMessage();


      try {

        localStream =
          await getMediaStream(type);


        currentCallType =
          type;

        currentRemotePeerId =
          destination;

        outgoingCallPending =
          true;


        createOutgoingStatusConnection(
          destination
        );


        currentCall =
          peer.call(
            destination,
            localStream,
            {
              metadata: {
                callType: type
              }
            }
          );


        if (!currentCall) {

          throw new Error(
            "Unable to create call."
          );

        }


        setupOutgoingCall(
          currentCall
        );


        showOutgoingCallingScreen(
          destination,
          type
        );


      } catch (error) {

        console.error(
          "Outgoing call error:",
          error
        );


        cleanupMedia();

        outgoingCallPending =
          false;

        currentCall =
          null;


        showMessage(
          getMediaErrorMessage(error),
          "error"
        );

      }

    }


    function setupOutgoingCall(call) {

      call.on(
        "stream",
        stream => {

          if (!outgoingCallPending) {
            return;
          }


          outgoingCallPending =
            false;


          showActiveCallScreen(
            call.peer,
            currentCallType
          );


          attachRemoteStream(
            stream
          );


          startCallTimer();

        }
      );


      call.on(
        "close",
        () => {

          if (outgoingCallPending) {

            outgoingCallPending =
              false;

            cleanupMedia();

            currentCall =
              null;

            hideOutgoingCallingScreen();

            showMessage(
              "Call ended.",
              "info"
            );

            return;
          }


          finishCall(
            "Call ended."
          );

        }
      );


      call.on(
        "error",
        error => {

          console.error(
            "Outgoing media call error:",
            error
          );


          if (outgoingCallPending) {

            outgoingCallPending =
              false;

            cleanupMedia();

            currentCall =
              null;

            hideOutgoingCallingScreen();

            handleCallError(
              error
            );

          } else {

            finishCall(
              "Connection failed."
            );

          }

        }
      );

    }


    /* =========================================================
       OUTGOING CALL SCREEN
    ========================================================= */

    function showOutgoingCallingScreen(
      destination,
      type
    ) {

      outgoingPeerId.textContent =
        destination;


      outgoingCallType.textContent =
        type === "video"
          ? "📹 Video Call"
          : "🎤 Audio Call";


      outgoingOverlay.classList.add(
        "show"
      );

    }


    function hideOutgoingCallingScreen() {

      outgoingOverlay.classList.remove(
        "show"
      );

    }


    cancelCallBtn.addEventListener(
      "click",
      () => {

        outgoingCallPending =
          false;


        if (currentCall) {

          try {

            currentCall.close();

          } catch (error) {

            console.error(error);

          }

        }


        currentCall =
          null;


        closeCallStatusConnection();

        cleanupMedia();

        hideOutgoingCallingScreen();


        showMessage(
          "Call cancelled.",
          "info"
        );

      }
    );


    /* =========================================================
       INCOMING CALL
    ========================================================= */

    function handleIncomingCall(call) {

      console.log(
        "Incoming call from:",
        call.peer
      );


      if (
        currentCall ||
        outgoingCallPending
      ) {

        sendStatusMessage(
          call.peer,
          {
            type: "declined",
            reason: "busy"
          }
        );


        try {

          call.close();

        } catch (error) {

          console.error(error);

        }


        return;
      }


      incomingCall =
        call;


      /*
       * Important:
       * If the caller cancels before you answer,
       * PeerJS closes this media connection.
       * This listener removes the incoming screen.
       */

      call.on(
        "close",
        () => {

          if (
            incomingCall === call
          ) {

            incomingCall =
              null;

            incomingOverlay.classList.remove(
              "show"
            );


            showMessage(
              "Call cancelled.",
              "info"
            );

          }

        }
      );


      currentCallType =
        call.metadata?.callType ||
        "audio";


      incomingPeerId.textContent =
        call.peer;


      incomingPeerIdInput.value =
        call.peer;


      incomingCallType.textContent =
        currentCallType === "video"
          ? "📹 Video Call"
          : "🎤 Audio Call";


      incomingOverlay.classList.add(
        "show"
      );

    }


    /* =========================================================
       ACCEPT INCOMING CALL
    ========================================================= */

    acceptBtn.addEventListener(
      "click",
      async () => {

        if (!incomingCall) {
          return;
        }


        const call =
          incomingCall;


        try {

          incomingOverlay.classList.remove(
            "show"
          );


          localStream =
            await getMediaStream(
              currentCallType
            );


          /*
           * Important:
           * Once accepted, this is no longer
           * an unanswered incoming call.
           */

          currentCall =
            call;

          incomingCall =
            null;


          call.answer(
            localStream
          );


          setupIncomingAcceptedCall(
            call
          );


          showActiveCallScreen(
            call.peer,
            currentCallType
          );


          waitingBanner.classList.remove(
            "show"
          );


        } catch (error) {

          console.error(
            "Accept call error:",
            error
          );


          try {

            call.close();

          } catch (closeError) {

            console.error(
              closeError
            );

          }


          incomingCall =
            null;

          currentCall =
            null;


          cleanupMedia();


          showMessage(
            getMediaErrorMessage(error),
            "error"
          );

        }

      }
    );


    function setupIncomingAcceptedCall(
      call
    ) {

      call.on(
        "stream",
        stream => {

          attachRemoteStream(
            stream
          );

          startCallTimer();

        }
      );


      call.on(
        "close",
        () => {

          finishCall(
            "Call ended."
          );

        }
      );


      call.on(
        "error",
        error => {

          console.error(
            "Incoming call error:",
            error
          );


          finishCall(
            "Connection failed."
          );

        }
      );

    }


    /* =========================================================
       REJECT INCOMING CALL
    ========================================================= */

    rejectBtn.addEventListener(
      "click",
      rejectCall
    );


    function rejectCall() {

      if (!incomingCall) {
        return;
      }


      const callerId =
        incomingCall.peer;


      sendStatusMessage(
        callerId,
        {
          type: "declined",
          reason: "rejected"
        }
      );


      try {

        incomingCall.close();

      } catch (error) {

        console.error(error);

      }


      incomingCall =
        null;


      incomingOverlay.classList.remove(
        "show"
      );


      showMessage(
        "Call declined.",
        "info"
      );

    }


    /* =========================================================
       MEDIA
    ========================================================= */

    async function getMediaStream(type) {

      if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
      ) {

        throw new Error(
          "Media devices are not supported by this browser."
        );

      }


      return await navigator
        .mediaDevices
        .getUserMedia({
          audio: true,
          video: type === "video"
        });

    }


    function attachRemoteStream(
      stream
    ) {

      remoteVideo.srcObject =
        stream;


      if (
        currentCallType === "video"
      ) {

        remoteVideo.style.display =
          "block";

        audioAvatar.style.display =
          "none";

      } else {

        remoteVideo.style.display =
          "none";

        audioAvatar.style.display =
          "flex";

      }


      remoteVideo
        .play()
        .catch(() => {});

    }


    function attachLocalStream() {

      if (!localStream) {
        return;
      }


      localVideo.srcObject =
        localStream;


      if (
        currentCallType === "video"
      ) {

        localVideo.style.display =
          "block";

      } else {

        localVideo.style.display =
          "none";

      }

    }


    /* =========================================================
       ACTIVE CALL SCREEN
    ========================================================= */

    function showActiveCallScreen(
      peerId,
      type
    ) {

      callPeerId.textContent =
        peerId;


      callTypeText.textContent =
        type === "video"
          ? "📹 Video Call"
          : "🎤 Audio Call";


      callTimer.textContent =
        "00:00";


      attachLocalStream();


      callScreen.classList.add(
        "show"
      );


      waitingBanner.classList.remove(
        "show"
      );

    }


    /* =========================================================
       TIMER
    ========================================================= */

    function startCallTimer() {

      stopCallTimer();


      callStartTime =
        Date.now();


      callTimer.textContent =
        "00:00";


      callTimerInterval =
        setInterval(
          () => {

            if (!callStartTime) {
              return;
            }


            const elapsed =
              Math.floor(
                (
                  Date.now() -
                  callStartTime
                ) / 1000
              );


            const minutes =
              Math.floor(
                elapsed / 60
              )
                .toString()
                .padStart(
                  2,
                  "0"
                );


            const seconds =
              (
                elapsed % 60
              )
                .toString()
                .padStart(
                  2,
                  "0"
                );


            callTimer.textContent =
              `${minutes}:${seconds}`;

          },
          1000
        );

    }


    function stopCallTimer() {

      if (callTimerInterval) {

        clearInterval(
          callTimerInterval
        );

        callTimerInterval =
          null;

      }


      callStartTime =
        null;

    }


    /* =========================================================
       MUTE
    ========================================================= */

    muteBtn.addEventListener(
      "click",
      () => {

        if (!localStream) {
          return;
        }


        const audioTracks =
          localStream.getAudioTracks();


        if (!audioTracks.length) {
          return;
        }


        isMuted =
          !isMuted;


        audioTracks.forEach(
          track => {

            track.enabled =
              !isMuted;

          }
        );


        if (isMuted) {

          muteBtn.textContent =
            "🔇";

          muteBtn.classList.add(
            "active"
          );

          muteBtn.title =
            "Unmute";

        } else {

          muteBtn.textContent =
            "🎤";

          muteBtn.classList.remove(
            "active"
          );

          muteBtn.title =
            "Mute";

        }

      }
    );


    /* =========================================================
       CAMERA
    ========================================================= */

    cameraBtn.addEventListener(
      "click",
      () => {

        if (!localStream) {
          return;
        }


        const videoTracks =
          localStream.getVideoTracks();


        if (!videoTracks.length) {
          return;
        }


        isCameraOff =
          !isCameraOff;


        videoTracks.forEach(
          track => {

            track.enabled =
              !isCameraOff;

          }
        );


        if (isCameraOff) {

          cameraBtn.textContent =
            "🚫";

          cameraBtn.classList.add(
            "active"
          );

          cameraBtn.title =
            "Turn Camera On";

        } else {

          cameraBtn.textContent =
            "📹";

          cameraBtn.classList.remove(
            "active"
          );

          cameraBtn.title =
            "Turn Camera Off";

        }

      }
    );


    /* =========================================================
       END CALL
    ========================================================= */

    endCallBtn.addEventListener(
      "click",
      () => {

        if (currentCall) {

          try {

            currentCall.close();

          } catch (error) {

            console.error(error);

          }

        }


        finishCall(
          "Call ended."
        );

      }
    );


    function finishCall(text) {

      stopCallTimer();


      outgoingCallPending =
        false;


      if (currentCall) {

        try {

          currentCall.close();

        } catch (error) {

          console.error(error);

        }

      }


      if (incomingCall) {

        try {

          incomingCall.close();

        } catch (error) {

          console.error(error);

        }

      }


      currentCall =
        null;

      incomingCall =
        null;


      cleanupMedia();

      closeCallStatusConnection();


      remoteVideo.srcObject =
        null;

      localVideo.srcObject =
        null;


      callScreen.classList.remove(
        "show"
      );

      outgoingOverlay.classList.remove(
        "show"
      );

      incomingOverlay.classList.remove(
        "show"
      );


      resetCallControls();


      showMessage(
        text,
        "info"
      );

    }


    /* =========================================================
       CLEANUP MEDIA
    ========================================================= */

    function cleanupMedia() {

      if (localStream) {

        localStream
          .getTracks()
          .forEach(
            track => {

              track.stop();

            }
          );


        localStream =
          null;

      }

    }


    function resetCallControls() {

      isMuted =
        false;

      isCameraOff =
        false;


      muteBtn.textContent =
        "🎤";

      muteBtn.classList.remove(
        "active"
      );

      muteBtn.title =
        "Mute";


      cameraBtn.textContent =
        "📹";

      cameraBtn.classList.remove(
        "active"
      );

      cameraBtn.title =
        "Camera";


      remoteVideo.style.display =
        "block";

      audioAvatar.style.display =
        "none";


      waitingBanner.classList.remove(
        "show"
      );

    }


    /* =========================================================
       CALL STATUS DATA CONNECTION
    ========================================================= */

    function handleIncomingDataConnection(
      connection
    ) {

      console.log(
        "Incoming data connection from:",
        connection.peer
      );


      connection.on(
        "open",
        () => {

          if (
            connection.label ===
            "call-status"
          ) {

            callStatusConnection =
              connection;

          }

        }
      );


      connection.on(
        "data",
        data => {

          handleCallStatusData(
            data
          );

        }
      );


      connection.on(
        "error",
        error => {

          console.error(
            "Status connection error:",
            error
          );

        }
      );


      connection.on(
        "close",
        () => {

          if (
            callStatusConnection &&
            callStatusConnection.peer ===
              connection.peer
          ) {

            callStatusConnection =
              null;

          }

        }
      );

    }


    function createOutgoingStatusConnection(
      destination
    ) {

      try {

        if (
          callStatusConnection &&
          callStatusConnection.open &&
          callStatusConnection.peer ===
            destination
        ) {

          return;

        }


        const connection =
          peer.connect(
            destination,
            {
              label: "call-status",
              reliable: true,
              serialization: "json"
            }
          );


        callStatusConnection =
          connection;


        connection.on(
          "open",
          () => {

            console.log(
              "Call status connection opened."
            );

          }
        );


        connection.on(
          "data",
          data => {

            handleCallStatusData(
              data
            );

          }
        );


        connection.on(
          "error",
          error => {

            console.error(
              "Call status connection error:",
              error
            );

          }
        );


        connection.on(
          "close",
          () => {

            if (
              callStatusConnection ===
              connection
            ) {

              callStatusConnection =
                null;

            }

          }
        );

      } catch (error) {

        console.error(
          "Could not create status connection:",
          error
        );

      }

    }


    function sendStatusMessage(
      destination,
      data
    ) {

      if (
        callStatusConnection &&
        callStatusConnection.open &&
        callStatusConnection.peer ===
          destination
      ) {

        try {

          callStatusConnection.send(
            data
          );

          return;

        } catch (error) {

          console.error(error);

        }

      }


      try {

        const connection =
          peer.connect(
            destination,
            {
              label: "call-status",
              reliable: true,
              serialization: "json"
            }
          );


        connection.on(
          "open",
          () => {

            try {

              connection.send(
                data
              );


              setTimeout(
                () => {

                  try {

                    connection.close();

                  } catch (error) {

                    console.error(
                      error
                    );

                  }

                },
                700
              );


            } catch (error) {

              console.error(
                "Could not send status message:",
                error
              );

            }

          }
        );


        connection.on(
          "error",
          error => {

            console.error(
              "Temporary status connection error:",
              error
            );

          }
        );

      } catch (error) {

        console.error(
          "Could not create status message connection:",
          error
        );

      }

    }


    function handleCallStatusData(
      data
    ) {

      if (
        !data ||
        !data.type
      ) {

        return;

      }


      console.log(
        "Call status received:",
        data
      );


      if (
        data.type ===
        "declined"
      ) {

        outgoingCallPending =
          false;


        if (currentCall) {

          try {

            currentCall.close();

          } catch (error) {

            console.error(
              error
            );

          }

        }


        currentCall =
          null;


        cleanupMedia();

        hideOutgoingCallingScreen();

        closeCallStatusConnection();


        if (
          data.reason ===
          "busy"
        ) {

          showMessage(
            "The person is currently on another call.",
            "info"
          );

        } else {

          showMessage(
            "Call declined.",
            "info"
          );

        }

      }

    }


    function closeCallStatusConnection() {

      if (callStatusConnection) {

        try {

          callStatusConnection.close();

        } catch (error) {

          console.error(
            error
          );

        }

      }


      callStatusConnection =
        null;

    }


    /* =========================================================
       PEER ERRORS
    ========================================================= */

    function handlePeerError(
      error
    ) {

      console.error(
        "PeerJS error:",
        error
      );


      if (
        error &&
        error.type ===
          "peer-unavailable"
      ) {

        if (
          outgoingCallPending
        ) {

          outgoingCallPending =
            false;


          if (currentCall) {

            try {

              currentCall.close();

            } catch (closeError) {

              console.error(
                closeError
              );

            }

          }


          currentCall =
            null;


          cleanupMedia();

          hideOutgoingCallingScreen();


          showMessage(
            "Peer ID unavailable. Check the Peer ID and try again.",
            "error"
          );

        } else {

          showMessage(
            "Peer ID unavailable.",
            "error"
          );

        }


        return;

      }


      if (
        error &&
        error.type ===
          "unavailable-id"
      ) {

        setStatus(
          "Peer ID unavailable",
          "error"
        );

        return;

      }


      if (
        error &&
        (
          error.type === "network" ||
          error.type === "server-error" ||
          error.type === "socket-error" ||
          error.type === "socket-closed"
        )
      ) {

        setStatus(
          "Connection problem",
          "error"
        );


        if (
          outgoingCallPending
        ) {

          outgoingCallPending =
            false;


          cleanupMedia();


          if (currentCall) {

            try {

              currentCall.close();

            } catch (closeError) {

              console.error(
                closeError
              );

            }

          }


          currentCall =
            null;


          hideOutgoingCallingScreen();


          showMessage(
            "Connection failed. Please try again.",
            "error"
          );

        }


        return;

      }


      if (
        error &&
        error.type ===
          "ssl-unavailable"
      ) {

        showMessage(
          "Secure connection is unavailable.",
          "error"
        );

        return;

      }


      if (
        error &&
        error.type ===
          "browser-incompatible"
      ) {

        showMessage(
          "This browser does not support the required calling features.",
          "error"
        );

        return;

      }


      showMessage(
        "A connection error occurred. Please try again.",
        "error"
      );

    }


    /* =========================================================
       MEDIA ERRORS
    ========================================================= */

    function handleMediaError(
      error
    ) {

      console.error(
        "Media error:",
        error
      );


      cleanupMedia();


      if (!error) {

        return (
          "Could not access your microphone or camera."
        );

      }


      if (
        error.name ===
        "NotAllowedError"
      ) {

        return (
          "Microphone or camera permission was denied. Please allow access and try again."
        );

      }


      if (
        error.name ===
        "NotFoundError"
      ) {

        return (
          "No microphone or camera was found."
        );

      }


      if (
        error.name ===
        "NotReadableError"
      ) {

        return (
          "Your microphone or camera is already being used by another application."
        );

      }


      return (
        "Could not access your microphone or camera."
      );

    }


    function getMediaErrorMessage(
      error
    ) {

      if (
        error &&
        (
          error.name ===
            "NotAllowedError" ||
          error.name ===
            "NotFoundError" ||
          error.name ===
            "NotReadableError"
        )
      ) {

        return handleMediaError(
          error
        );

      }


      return (
        error?.message ||
        "Could not start the call."
      );

    }


    function handleCallError(
      error
    ) {

      console.error(
        "Call connection error:",
        error
      );


      cleanupMedia();

      currentCall =
        null;


      hideOutgoingCallingScreen();


      if (
        error &&
        error.type ===
          "peer-unavailable"
      ) {

        showMessage(
          "Peer ID unavailable. Check the Peer ID and try again.",
          "error"
        );

      } else {

        showMessage(
          "Connection failed. Please try again.",
          "error"
        );

      }

    }


    /* =========================================================
       PEER RECONNECTION
    ========================================================= */

    function handleDisconnected() {

      setStatus(
        "Reconnecting...",
        "warning"
      );


      disableCallButtons();


      setTimeout(
        () => {

          if (
            peer &&
            !peer.destroyed &&
            !peer.open
          ) {

            try {

              peer.reconnect();

            } catch (error) {

              console.error(
                error
              );

            }

          }

        },
        1500
      );

    }


    /* =========================================================
       BEFORE UNLOAD
    ========================================================= */

    window.addEventListener(
      "beforeunload",
      () => {

        stopCallTimer();

        cleanupMedia();


        if (currentCall) {

          try {

            currentCall.close();

          } catch (error) {

            console.error(
              error
            );

          }

        }


        closeCallStatusConnection();


        if (peer) {

          try {

            peer.destroy();

          } catch (error) {

            console.error(
              error
            );

          }

        }

      }
    );


    /* =========================================================
       START
    ========================================================= */

    initializePeer();

  </script>
