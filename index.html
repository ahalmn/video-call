<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Private Call</title>

  <script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #172033;
      --muted: #6b7280;
      --border: #e5e7eb;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --success: #16a34a;
      --danger: #dc2626;
      --warning: #d97706;
      --dark: #111827;
      --shadow: 0 15px 45px rgba(15, 23, 42, 0.09);
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    }

    body {
      min-height: 100vh;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .app {
      min-height: 100vh;
      padding: 18px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 540px;
    }

    /* HEADER */

    .header {
      text-align: center;
      margin-bottom: 16px;
    }

    .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 10px;
      border-radius: 20px;
      background: #e8efff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      box-shadow: 0 8px 25px rgba(37, 99, 235, 0.12);
    }

    .header h1 {
      margin: 0;
      font-size: 26px;
      letter-spacing: -0.5px;
    }

    .header p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    /* STATUS */

    .status {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 17px;
      padding: 12px 15px;
      display: flex;
      align-items: center;
      gap: 11px;
      margin-bottom: 13px;
      box-shadow: 0 5px 20px rgba(15, 23, 42, 0.04);
    }

    .status-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #9ca3af;
      flex-shrink: 0;
    }

    .status-dot.online {
      background: var(--success);
      box-shadow: 0 0 0 4px rgba(22, 163, 74, 0.12);
    }

    .status-dot.connecting {
      background: var(--warning);
      box-shadow: 0 0 0 4px rgba(217, 119, 6, 0.12);
    }

    .status-dot.offline {
      background: var(--danger);
      box-shadow: 0 0 0 4px rgba(220, 38, 38, 0.12);
    }

    .status-content {
      min-width: 0;
    }

    .status-title {
      font-weight: 700;
      font-size: 14px;
    }

    .status-description {
      color: var(--muted);
      font-size: 12px;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* CARD */

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 22px;
      box-shadow: var(--shadow);
    }

    /* PEER ID */

    .section-title {
      font-size: 15px;
      font-weight: 750;
      margin-bottom: 9px;
    }

    .id-box {
      display: flex;
      gap: 8px;
      margin-bottom: 7px;
    }

    .peer-id {
      flex: 1;
      min-width: 0;
      height: 50px;
      border: 1px solid var(--border);
      background: #f8fafc;
      border-radius: 14px;
      padding: 0 13px;
      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        monospace;
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      outline: none;
    }

    .peer-id:focus {
      border-color: var(--primary);
    }

    .copy-button {
      height: 50px;
      min-width: 58px;
      padding: 0 13px;
      border-radius: 14px;
      background: #e8efff;
      color: var(--primary-dark);
      font-weight: 750;
    }

    .copy-button:active {
      transform: scale(0.97);
    }

    .id-help {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
      margin-bottom: 22px;
    }

    /* REMOTE ID */

    .remote-input {
      width: 100%;
      height: 52px;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 0 14px;
      outline: none;
      color: var(--text);
      background: #fff;
      font-size: 15px;
    }

    .remote-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
    }

    .remote-input::placeholder {
      color: #9ca3af;
    }

    .remote-help {
      color: var(--muted);
      font-size: 12px;
      margin: 7px 0 18px;
    }

    /* CALL BUTTONS */

    .call-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 11px;
    }

    .call-button {
      min-height: 112px;
      border-radius: 19px;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.12s ease, opacity 0.12s ease;
    }

    .call-button:active {
      transform: scale(0.97);
    }

    .call-button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .audio {
      background: #2563eb;
    }

    .video {
      background: #7c3aed;
    }

    .call-icon {
      font-size: 31px;
    }

    .call-label {
      font-size: 14px;
      font-weight: 750;
    }

    /* MESSAGE */

    .message {
      display: none;
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 13px;
      font-size: 13px;
      line-height: 1.45;
    }

    .message.show {
      display: block;
    }

    .message.info {
      color: #1e40af;
      background: #dbeafe;
      border: 1px solid #bfdbfe;
    }

    .message.error {
      color: #991b1b;
      background: #fee2e2;
      border: 1px solid #fecaca;
    }

    .message.success {
      color: #166534;
      background: #dcfce7;
      border: 1px solid #bbf7d0;
    }

    /* FOOTER */

    .footer {
      text-align: center;
      color: #8b95a7;
      font-size: 11px;
      margin-top: 13px;
      line-height: 1.5;
    }

    /* INCOMING CALL */

    .incoming-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(8px);
    }

    .incoming-overlay.show {
      display: flex;
    }

    .incoming-card {
      width: 100%;
      max-width: 390px;
      background: white;
      border-radius: 27px;
      padding: 29px 22px 22px;
      text-align: center;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.25);
    }

    .incoming-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 14px;
      border-radius: 50%;
      background: #e8efff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
    }

    .incoming-card h2 {
      margin: 0;
      font-size: 22px;
    }

    .incoming-peer {
      margin-top: 7px;
      color: var(--muted);
      font-family: monospace;
      font-size: 13px;
      word-break: break-all;
    }

    .incoming-type {
      margin: 5px 0 21px;
      color: var(--muted);
      font-size: 13px;
    }

    .incoming-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .incoming-button {
      height: 54px;
      border-radius: 15px;
      font-weight: 750;
    }

    .reject {
      background: #fee2e2;
      color: #b91c1c;
    }

    .accept {
      background: #dcfce7;
      color: #15803d;
    }

    /* CALL SCREEN */

    .call-screen {
      position: fixed;
      inset: 0;
      z-index: 90;
      display: none;
      flex-direction: column;
      background: #080b12;
      color: white;
    }

    .call-screen.show {
      display: flex;
    }

    .call-header {
      height: 66px;
      flex-shrink: 0;
      padding: 11px 17px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(8, 11, 18, 0.9);
      z-index: 5;
    }

    .caller-name {
      font-weight: 750;
      font-size: 15px;
    }

    .timer {
      color: #aeb7c7;
      font-size: 12px;
      margin-top: 2px;
    }

    .call-type {
      color: #aeb7c7;
      font-size: 12px;
    }

    .video-area {
      flex: 1;
      min-height: 0;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #080b12;
    }

    #remoteVideo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #080b12;
    }

    #localVideo {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 112px;
      height: 150px;
      object-fit: cover;
      border-radius: 15px;
      border: 2px solid rgba(255,255,255,0.25);
      background: #171c27;
      z-index: 4;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    .audio-avatar {
      display: none;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: #2563eb;
      align-items: center;
      justify-content: center;
      font-size: 50px;
    }

    .audio-mode .audio-avatar {
      display: flex;
    }

    .audio-mode #remoteVideo,
    .audio-mode #localVideo {
      display: none;
    }

    .call-controls {
      flex-shrink: 0;
      padding:
        17px
        15px
        calc(17px + env(safe-area-inset-bottom));
      background: rgba(8, 11, 18, 0.96);
    }

    .controls-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 11px;
    }

    .control {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #252b37;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      font-size: 20px;
    }

    .control small {
      font-size: 8px;
      opacity: 0.8;
    }

    .control.active {
      background: white;
      color: #111827;
    }

    .end-call {
      width: 66px;
      height: 56px;
      border-radius: 28px;
      background: #dc2626;
      font-size: 24px;
    }

    @media (max-width: 430px) {
      .app {
        padding: 12px;
      }

      .card {
        padding: 18px;
        border-radius: 21px;
      }

      .header h1 {
        font-size: 24px;
      }

      .logo {
        width: 58px;
        height: 58px;
      }

      .call-button {
        min-height: 105px;
      }

      #localVideo {
        width: 95px;
        height: 128px;
      }

      .control {
        width: 52px;
        height: 52px;
      }

      .end-call {
        width: 62px;
        height: 52px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <main class="container">


    <!-- STATUS -->
    <div class="status">

      <div
        id="statusDot"
        class="status-dot connecting"
      ></div>

      <div class="status-content">

        <div
          id="statusTitle"
          class="status-title"
        >
          Connecting…
        </div>

        <div
          id="statusDescription"
          class="status-description"
        >
          Connecting to PeerJS
        </div>

      </div>

    </div>


    <!-- MAIN CARD -->
    <section class="card">

      <!-- YOUR PEER ID -->
      <div class="section-title">
        Your Peer ID
      </div>

      <div class="id-box">

        <input
          id="myPeerId"
          class="peer-id"
          type="text"
          readonly
          placeholder="Generating…"
        >

        <button
          id="copyButton"
          class="copy-button"
          onclick="copyPeerId()"
          disabled
        >
          Copy
        </button>

      </div>

      <div class="id-help">
        Share this Peer ID with the person who wants to call you.
      </div>


      <!-- REMOTE PEER ID -->
      <div class="section-title">
        Enter Peer ID to Call
      </div>

      <input
        id="remotePeerId"
        class="remote-input"
        type="text"
        autocomplete="off"
        autocapitalize="none"
        spellcheck="false"
      >

      <div class="remote-help">
        Enter the other person's Peer ID.
      </div>


      <!-- CALL BUTTONS -->
      <div class="call-buttons">

        <button
          id="audioButton"
          class="call-button audio"
          onclick="startCall('audio')"
          disabled
        >

          <span class="call-icon">
            🎤
          </span>

          <span class="call-label">
            Audio Call
          </span>

        </button>


        <button
          id="videoButton"
          class="call-button video"
          onclick="startCall('video')"
          disabled
        >

          <span class="call-icon">
            📹
          </span>

          <span class="call-label">
            Video Call
          </span>

        </button>

      </div>


      <!-- MESSAGE -->
      <div
        id="message"
        class="message"
      ></div>

    </section>


  </main>

</div>


<!-- ============================
     INCOMING CALL
============================= -->

<div
  id="incomingOverlay"
  class="incoming-overlay"
>

  <div class="incoming-card">

    <div class="incoming-icon">
      📞
    </div>

    <h2>
      Incoming Call
    </h2>

    <div
      id="incomingPeer"
      class="incoming-peer"
    >
      —
    </div>

    <div
      id="incomingType"
      class="incoming-type"
    >
      —
    </div>

    <div class="incoming-buttons">

      <button
        class="incoming-button reject"
        onclick="rejectCall()"
      >
        ❌ Reject
      </button>

      <button
        class="incoming-button accept"
        onclick="acceptCall()"
      >
        ✅ Accept
      </button>

    </div>

  </div>

</div>


<!-- ============================
     ACTIVE CALL
============================= -->

<div
  id="callScreen"
  class="call-screen"
>

  <div class="call-header">

    <div>

      <div
        id="callerName"
        class="caller-name"
      >
        Connected
      </div>

      <div
        id="timer"
        class="timer"
      >
        00:00
      </div>

    </div>

    <div
      id="callType"
      class="call-type"
    >
      Video Call
    </div>

  </div>


  <div
    id="videoArea"
    class="video-area"
  >

    <video
      id="remoteVideo"
      autoplay
      playsinline
    ></video>

    <video
      id="localVideo"
      autoplay
      muted
      playsinline
    ></video>

    <div class="audio-avatar">
      🎧
    </div>

  </div>


  <div class="call-controls">

    <div class="controls-row">

      <button
        id="muteButton"
        class="control"
        onclick="toggleMute()"
      >
        🎤
        <small>Mute</small>
      </button>


      <button
        id="cameraButton"
        class="control"
        onclick="toggleCamera()"
      >
        📷
        <small>Camera</small>
      </button>


      <button
        class="control end-call"
        onclick="endCall()"
      >
        ☎
      </button>

    </div>

  </div>

</div>


<script>

/* ============================================================
   APPLICATION
============================================================ */

let peer = null;

let currentCall = null;

let incomingCall = null;

let localStream = null;

let remoteStream = null;

let currentCallType = null;

let isMuted = false;

let isCameraOff = false;

let timerStart = null;

let timerInterval = null;

let peerReady = false;


/* ============================================================
   DOM
============================================================ */

const myPeerId =
  document.getElementById("myPeerId");

const remotePeerId =
  document.getElementById("remotePeerId");

const copyButton =
  document.getElementById("copyButton");

const audioButton =
  document.getElementById("audioButton");

const videoButton =
  document.getElementById("videoButton");

const statusDot =
  document.getElementById("statusDot");

const statusTitle =
  document.getElementById("statusTitle");

const statusDescription =
  document.getElementById("statusDescription");

const message =
  document.getElementById("message");

const incomingOverlay =
  document.getElementById("incomingOverlay");

const incomingPeer =
  document.getElementById("incomingPeer");

const incomingType =
  document.getElementById("incomingType");

const callScreen =
  document.getElementById("callScreen");

const videoArea =
  document.getElementById("videoArea");

const remoteVideo =
  document.getElementById("remoteVideo");

const localVideo =
  document.getElementById("localVideo");

const callerName =
  document.getElementById("callerName");

const callType =
  document.getElementById("callType");

const timer =
  document.getElementById("timer");

const muteButton =
  document.getElementById("muteButton");

const cameraButton =
  document.getElementById("cameraButton");


/* ============================================================
   INITIALIZE
============================================================ */

window.addEventListener(
  "DOMContentLoaded",
  initialize
);


function initialize() {

  setStatus(
    "connecting",
    "Connecting…",
    "Creating your Peer ID"
  );

  createPeer();

}


/* ============================================================
   CREATE PEER
============================================================ */

function createPeer() {

  /*
    No ID is supplied here.

    PeerJS generates a unique temporary Peer ID
    for this browser session.
  */

  peer =
    new Peer({
      debug: 1
    });


  peer.on(
    "open",
    handlePeerOpen
  );


  peer.on(
    "call",
    handleIncomingCall
  );


  peer.on(
    "error",
    handlePeerError
  );


  peer.on(
    "disconnected",
    handleDisconnected
  );


  peer.on(
    "close",
    handlePeerClose
  );

}


/* ============================================================
   PEER OPEN
============================================================ */

function handlePeerOpen(id) {

  console.log(
    "My Peer ID:",
    id
  );


  peerReady = true;


  myPeerId.value =
    id;


  copyButton.disabled =
    false;


  audioButton.disabled =
    false;


  videoButton.disabled =
    false;


  setStatus(
    "online",
    "Online",
    "Your Peer ID is ready"
  );


  showMessage(
    "Your Peer ID is ready. Share it with the person who wants to call you.",
    "success"
  );

}


/* ============================================================
   COPY PEER ID
============================================================ */

async function copyPeerId() {

  const id =
    myPeerId.value.trim();

  if (!id) {
    return;
  }


  try {

    await navigator.clipboard.writeText(
      id
    );

    showMessage(
      "Peer ID copied to clipboard.",
      "success"
    );

  } catch (error) {

    /*
      Fallback for browsers where
      clipboard API is unavailable.
    */

    myPeerId.select();

    document.execCommand(
      "copy"
    );

    showMessage(
      "Peer ID copied.",
      "success"
    );

  }

}


/* ============================================================
   START CALL
============================================================ */

async function startCall(type) {

  if (!peerReady) {

    showMessage(
      "Please wait until your Peer ID is ready.",
      "error"
    );

    return;
  }


  const destination =
    remotePeerId.value.trim();


  if (!destination) {

    showMessage(
      "Enter the other person's Peer ID first.",
      "error"
    );

    remotePeerId.focus();

    return;
  }


  if (
    destination === myPeerId.value.trim()
  ) {

    showMessage(
      "You cannot call your own Peer ID.",
      "error"
    );

    return;
  }


  currentCallType =
    type;


  try {

    localStream =
      await navigator.mediaDevices.getUserMedia({

        audio: true,

        video:
          type === "video"

      });

  } catch (error) {

    console.error(
      "Media error:",
      error
    );

    handleMediaError(
      error
    );

    return;

  }


  showMessage(
    "Calling " + destination + "…",
    "info"
  );


  currentCall =
    peer.call(
      destination,
      localStream,
      {
        metadata: {
          callType: type
        }
      }
    );


  if (!currentCall) {

    stopLocalStream();

    showMessage(
      "The call could not be started.",
      "error"
    );

    return;

  }


  configureOutgoingCall(
    currentCall
  );

}


/* ============================================================
   OUTGOING CALL
============================================================ */

function configureOutgoingCall(call) {

  call.on(
    "stream",
    stream => {

      remoteStream =
        stream;

      attachRemoteStream(
        stream
      );

      showCallScreen();

    }
  );


  call.on(
    "close",
    () => {

      finishCall(
        "The other person ended the call."
      );

    }
  );


  call.on(
    "error",
    error => {

      console.error(
        "Call error:",
        error
      );

      finishCall(
        "The call connection failed."
      );

    }
  );


  showCallScreen();

}


/* ============================================================
   INCOMING CALL
============================================================ */

function handleIncomingCall(call) {

  console.log(
    "Incoming call from:",
    call.peer
  );


  /*
    If already in a call, reject automatically.
  */

  if (currentCall) {

    call.close();

    return;

  }


  incomingCall =
    call;


  currentCallType =
    call.metadata?.callType ||
    "audio";


  incomingPeer.textContent =
    call.peer;


  incomingType.textContent =
    currentCallType === "video"
      ? "📹 Video Call"
      : "🎤 Audio Call";


  incomingOverlay.classList.add(
    "show"
  );

}


/* ============================================================
   ACCEPT
============================================================ */

async function acceptCall() {

  if (!incomingCall) {
    return;
  }


  const call =
    incomingCall;


  incomingCall =
    null;


  incomingOverlay.classList.remove(
    "show"
  );


  try {

    localStream =
      await navigator.mediaDevices.getUserMedia({

        audio: true,

        video:
          currentCallType === "video"

      });

  } catch (error) {

    call.close();

    handleMediaError(
      error
    );

    return;

  }


  currentCall =
    call;


  call.answer(
    localStream
  );


  call.on(
    "stream",
    stream => {

      remoteStream =
        stream;

      attachRemoteStream(
        stream
      );

    }
  );


  call.on(
    "close",
    () => {

      finishCall(
        "The other person ended the call."
      );

    }
  );


  call.on(
    "error",
    error => {

      console.error(
        "Incoming call error:",
        error
      );

      finishCall(
        "The call connection failed."
      );

    }
  );


  showCallScreen();

}


/* ============================================================
   REJECT
============================================================ */

function rejectCall() {

  if (incomingCall) {

    try {

      incomingCall.send({
        type: "declined"
      });

    } catch (error) {

      console.error(
        "Could not send decline signal:",
        error
      );

    }


    try {

      incomingCall.close();

    } catch (error) {

      console.error(
        error
      );

    }

  }


  incomingCall =
    null;


  incomingOverlay.classList.remove(
    "show"
  );


  showMessage(
    "Call declined.",
    "info"
  );

}

  if (incomingCall) {

    try {

      incomingCall.close();

    } catch (error) {

      console.error(
        error
      );

    }

  }


  incomingCall =
    null;


  incomingOverlay.classList.remove(
    "show"
  );


  showMessage(
    "Call rejected.",
    "info"
  );

}


/* ============================================================
   SHOW CALL SCREEN
============================================================ */

function showCallScreen() {

  callScreen.classList.add(
    "show"
  );


  if (
    currentCallType === "audio"
  ) {

    videoArea.classList.add(
      "audio-mode"
    );

    callType.textContent =
      "Audio Call";

  } else {

    videoArea.classList.remove(
      "audio-mode"
    );

    callType.textContent =
      "Video Call";

  }


  callerName.textContent =
    currentCall
      ? currentCall.peer
      : "Connected";


  startTimer();

}


/* ============================================================
   REMOTE STREAM
============================================================ */

function attachRemoteStream(
  stream
) {

  remoteVideo.srcObject =
    stream;


  remoteVideo
    .play()
    .catch(
      error => {
        console.log(
          "Autoplay:",
          error
        );
      }
    );


  if (
    currentCallType === "video" &&
    localStream
  ) {

    localVideo.srcObject =
      localStream;

  }

}


/* ============================================================
   MUTE
============================================================ */

function toggleMute() {

  if (!localStream) {
    return;
  }


  const tracks =
    localStream.getAudioTracks();


  if (!tracks.length) {
    return;
  }


  isMuted =
    !isMuted;


  tracks.forEach(
    track => {
      track.enabled =
        !isMuted;
    }
  );


  if (isMuted) {

    muteButton.innerHTML =
      "🔇<small>Unmute</small>";

    muteButton.classList.add(
      "active"
    );

  } else {

    muteButton.innerHTML =
      "🎤<small>Mute</small>";

    muteButton.classList.remove(
      "active"
    );

  }

}


/* ============================================================
   CAMERA
============================================================ */

function toggleCamera() {

  if (!localStream) {
    return;
  }


  const tracks =
    localStream.getVideoTracks();


  if (!tracks.length) {
    return;
  }


  isCameraOff =
    !isCameraOff;


  tracks.forEach(
    track => {
      track.enabled =
        !isCameraOff;
    }
  );


  if (isCameraOff) {

    cameraButton.innerHTML =
      "🚫<small>Camera</small>";

    cameraButton.classList.add(
      "active"
    );

  } else {

    cameraButton.innerHTML =
      "📷<small>Camera</small>";

    cameraButton.classList.remove(
      "active"
    );

  }

}


/* ============================================================
   END CALL
============================================================ */

function endCall() {

  if (currentCall) {

    try {

      currentCall.close();

    } catch (error) {

      console.error(
        error
      );

    }

  }


  finishCall(
    "Call ended."
  );

}


/* ============================================================
   FINISH CALL
============================================================ */

function finishCall(
  text = ""
) {

  stopLocalStream();

  stopTimer();


  currentCall =
    null;

  remoteStream =
    null;


  remoteVideo.srcObject =
    null;

  localVideo.srcObject =
    null;


  callScreen.classList.remove(
    "show"
  );


  videoArea.classList.remove(
    "audio-mode"
  );


  isMuted =
    false;

  isCameraOff =
    false;


  muteButton.innerHTML =
    "🎤<small>Mute</small>";

  cameraButton.innerHTML =
    "📷<small>Camera</small>";


  muteButton.classList.remove(
    "active"
  );

  cameraButton.classList.remove(
    "active"
  );


  if (text) {

    showMessage(
      text,
      "info"
    );

  }

}


/* ============================================================
   STOP MEDIA
============================================================ */

function stopLocalStream() {

  if (!localStream) {
    return;
  }


  localStream
    .getTracks()
    .forEach(
      track => {

        try {

          track.stop();

        } catch (error) {}

      }
    );


  localStream =
    null;

}


/* ============================================================
   TIMER
============================================================ */

function startTimer() {

  stopTimer();


  timerStart =
    Date.now();


  updateTimer();


  timerInterval =
    setInterval(
      updateTimer,
      1000
    );

}


function updateTimer() {

  if (!timerStart) {
    return;
  }


  const seconds =
    Math.floor(
      (Date.now() - timerStart) / 1000
    );


  const minutes =
    Math.floor(seconds / 60)
      .toString()
      .padStart(2, "0");


  const remaining =
    (seconds % 60)
      .toString()
      .padStart(2, "0");


  timer.textContent =
    minutes + ":" + remaining;

}


function stopTimer() {

  if (timerInterval) {

    clearInterval(
      timerInterval
    );

  }


  timerInterval =
    null;

  timerStart =
    null;

  timer.textContent =
    "00:00";

}


/* ============================================================
   PEER DISCONNECTED
============================================================ */

function handleDisconnected() {

  console.warn(
    "PeerJS disconnected."
  );


  peerReady =
    false;


  audioButton.disabled =
    true;

  videoButton.disabled =
    true;


  setStatus(
    "offline",
    "Connection Lost",
    "Trying to reconnect…"
  );


  setTimeout(
    () => {

      if (
        peer &&
        peer.disconnected &&
        !peer.destroyed
      ) {

        try {

          peer.reconnect();

        } catch (error) {

          console.error(
            error
          );

        }

      }

    },
    1500
  );

}


/* ============================================================
   PEER CLOSE
============================================================ */

function handlePeerClose() {

  peerReady =
    false;


  audioButton.disabled =
    true;

  videoButton.disabled =
    true;


  setStatus(
    "offline",
    "Offline",
    "Peer connection closed"
  );

}


/* ============================================================
   PEER ERRORS
============================================================ */

function handlePeerError(error) {

  console.error(
    "PeerJS error:",
    error
  );


  let text =
    error.message ||
    "An unexpected PeerJS error occurred.";


  switch (error.type) {

    case "peer-unavailable":

      text =
        "That Peer ID is currently offline or does not exist.";

      break;


    case "unavailable-id":

      text =
        "This Peer ID is already being used. Please reload the page.";

      break;


    case "network":

      text =
        "Network connection problem. Check your internet connection.";

      break;


    case "server-error":

      text =
        "The PeerJS signaling server returned an error.";

      break;


    case "socket-error":

      text =
        "Could not connect to the PeerJS signaling server.";

      break;


    case "socket-closed":

      text =
        "The PeerJS connection was closed.";

      break;


    case "ssl-unavailable":

      text =
        "A secure PeerJS connection could not be established.";

      break;


    case "browser-incompatible":

      text =
        "This browser does not support the required WebRTC features.";

      break;

  }


  setStatus(
    "offline",
    "Connection Error",
    text
  );


  showMessage(
    text,
    "error"
  );

}


/* ============================================================
   MEDIA ERROR
============================================================ */

function handleMediaError(error) {

  console.error(
    "Media error:",
    error
  );


  let text =
    "Could not access the microphone or camera.";


  if (
    error.name ===
    "NotAllowedError"
  ) {

    text =
      "Microphone/camera permission was denied. Allow permission in your browser and try again.";

  }


  if (
    error.name ===
    "NotFoundError"
  ) {

    text =
      "No suitable microphone or camera was found.";

  }


  if (
    error.name ===
    "NotReadableError"
  ) {

    text =
      "Your microphone or camera is being used by another application.";

  }


  showMessage(
    text,
    "error"
  );

}


/* ============================================================
   STATUS
============================================================ */

function setStatus(
  type,
  title,
  description
) {

  statusDot.className =
    "status-dot " + type;

  statusTitle.textContent =
    title;

  statusDescription.textContent =
    description;

}


/* ============================================================
   MESSAGE
============================================================ */

function showMessage(
  text,
  type = "info"
) {

  message.textContent =
    text;

  message.className =
    "message show " + type;

}


/* ============================================================
   PAGE CLEANUP
============================================================ */

window.addEventListener(
  "beforeunload",
  () => {

    stopLocalStream();

    if (currentCall) {

      try {

        currentCall.close();

      } catch (error) {}

    }


    if (peer) {

      try {

        peer.destroy();

      } catch (error) {}

    }

  }
);

</script>
